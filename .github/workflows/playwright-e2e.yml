name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: booking-system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking-system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/booking-system
      DATABASE_URL_E2E: postgresql://postgres:password@localhost:5432/booking-system-e2e
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest suite
        run: bun run test

      - name: Create e2e database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          EXISTS=$(PGPASSWORD=password psql -h localhost -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'booking-system-e2e'")
          if [ "$EXISTS" != "1" ]; then
            PGPASSWORD=password psql -h localhost -U postgres -d postgres -c "CREATE DATABASE \"booking-system-e2e\";"
          fi

      - name: Apply migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_E2E }}

      - name: Seed e2e data
        run: bun run db:seed:e2e

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_E2E }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
